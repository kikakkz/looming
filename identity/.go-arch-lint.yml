# AD-23 dependency matrix for the identity component (AD-34 component
# scope). Version 3 schema (go-arch-lint v1.19): dependencies not
# declared under deps: are rejected. internal/ visibility plus this
# matrix are the two gates on package coupling.
#
# principal-app and policy-app additionally depend on authn-port for
# one reason only: their admin handlers read the validated session
# (TokenInfo, including its request-context plumbing — both defined in
# authn-port) that the authn middleware produced, e.g. to name the actor
# in the policy audit column. principal-app also reads policy-domain
# directly: registration dispatches on the Mode vocabulary of the
# policy aggregate. No persistence coupling crosses capabilities.
#
# authn-adapter queries the principals table via its own SQL (the local
# provider's private read model: password hash, status, roles); it does
# not import principal-port for that. gatewayfeed-adapter does the same
# on principals + loom_keys + identity_map: the feed is a projection of
# all three tables, not any aggregate. Its credential unsealing goes
# through a CredentialOpener interface defined in gatewayfeed-port and
# satisfied structurally by the key sealer in cmd — the feed seam stays
# feed-local (the RevisionNotifier precedent).
#
# key-app depends on principal-port for the issuance gate (exists +
# active) and on authn-port for the validated session its self handlers
# scope by — the same single-purpose authn-port dependency principal-app
# and policy-app carry. It also reads principal-domain directly: the
# issuance gate dispatches on the principal Status vocabulary and maps
# the principal aggregate's ErrNotFound sentinel — the principal-app →
# policy-domain precedent. The feed-revision hub reaches the mutating
# capabilities as a consumer-side RevisionNotifier interface defined in
# each app package, so no new coupling edge is needed for it (the
# PasswordHasher precedent).
#
# Slice C (quota + provisioning) adds the same shape of deliberate
# edges:
# - provision-port imports quota-domain because the EngineProvisioner
#   contract speaks in Quota values (identity-l1 §5); key-app and
#   quota-app consume the provisioner without touching adapter code.
# - key-app additionally depends on quota-port/domain (the provision
#   step reads the principal's quota) and on provision-port (the
#   provisioner + the map reads at revocation) — the Issue use case is
#   the orchestration home of provision-on-issue (identity-l1 §3).
# - key-port and key-adapter import provision-domain for
#   CreateWithProvision: the issuance transaction spans loom_keys and
#   identity_map, so the key repository persists the provision
#   aggregate's row inside one tx (the CreateWithInviteConsume
#   precedent: one adapter, one tx, both aggregates or neither).
# - The IdentityMap aggregate lives in provision-domain; its sealed
#   credential blob is the LoomingKey dual-track precedent (AD-35:
#   plaintext credentials never enter this context).
version: 3

allow:
  depOnAnyVendor: true # pinned deps live in go.mod; matrix governs
                       # component coupling, the job it exists for
  deepScan: false    # DI-pattern noise: adapters implementing ports
                     # consumed by app are the hexagon, not a violation

excludeFiles:
  - "^.*_test\\.go$" # test doubles legitimately cross seams

components:
  principal-domain:   { in: internal/principal/domain }
  principal-port:     { in: internal/principal/port }
  principal-app:      { in: internal/principal/app }
  principal-adapter:  { in: internal/principal/adapter }
  policy-domain:      { in: internal/policy/domain }
  policy-port:        { in: internal/policy/port }
  policy-app:         { in: internal/policy/app }
  policy-adapter:     { in: internal/policy/adapter }
  authn-domain:       { in: internal/authn/domain }
  authn-port:         { in: internal/authn/port }
  authn-app:          { in: internal/authn/app }
  authn-adapter:      { in: internal/authn/adapter }
  key-domain:         { in: internal/key/domain }
  key-port:           { in: internal/key/port }
  key-app:            { in: internal/key/app }
  key-adapter:        { in: internal/key/adapter }
  quota-domain:       { in: internal/quota/domain }
  quota-port:         { in: internal/quota/port }
  quota-app:          { in: internal/quota/app }
  quota-adapter:      { in: internal/quota/adapter }
  provision-domain:   { in: internal/provision/domain }
  provision-port:     { in: internal/provision/port }
  provision-app:      { in: internal/provision/app }
  provision-adapter:  { in: internal/provision/adapter }
  provision-adapter-litellm: { in: internal/provision/adapter/litellm }
  gatewayfeed-domain: { in: internal/gatewayfeed/domain }
  gatewayfeed-port:   { in: internal/gatewayfeed/port }
  gatewayfeed-app:    { in: internal/gatewayfeed/app }
  gatewayfeed-adapter: { in: internal/gatewayfeed/adapter }
  migrations:         { in: migrations }
  tests:              { in: tests/pgtest }
  cmd:                { in: cmd/identityd }

deps:
  principal-port:
    mayDependOn: [principal-domain]

  principal-app:
    mayDependOn: [principal-domain, principal-port, policy-domain, policy-port, authn-port]

  principal-adapter:
    mayDependOn: [principal-domain, principal-port]

  policy-port:
    mayDependOn: [policy-domain]

  policy-app:
    mayDependOn: [policy-domain, policy-port, authn-port]

  policy-adapter:
    mayDependOn: [policy-domain, policy-port]

  authn-port:
    mayDependOn: [authn-domain]

  authn-app:
    mayDependOn: [authn-domain, authn-port]

  authn-adapter:
    mayDependOn: [authn-domain, authn-port, principal-domain, principal-port] # OIDC auto-registration resolves principals through the principal capability's port (slice E)

  key-port:
    mayDependOn: [key-domain, provision-domain]

  key-app:
    mayDependOn: [key-domain, key-port, principal-domain, principal-port, authn-port, provision-domain, provision-port, quota-domain, quota-port]

  key-adapter:
    mayDependOn: [key-domain, key-port, provision-domain]

  quota-port:
    mayDependOn: [quota-domain]

  quota-app:
    mayDependOn: [quota-domain, quota-port, principal-domain, principal-port, authn-port, provision-port]

  quota-adapter:
    mayDependOn: [quota-domain, quota-port]

  provision-port:
    mayDependOn: [provision-domain, quota-domain]

  provision-app:
    mayDependOn: [provision-domain, provision-port]

  provision-adapter:
    mayDependOn: [provision-domain, provision-port]

  provision-adapter-litellm:
    mayDependOn: [provision-domain, provision-port, quota-domain]

  gatewayfeed-port:
    mayDependOn: [gatewayfeed-domain]

  gatewayfeed-app:
    mayDependOn: [gatewayfeed-domain, gatewayfeed-port]

  gatewayfeed-adapter:
    mayDependOn: [gatewayfeed-domain, gatewayfeed-port, principal-domain]

  tests:
    mayDependOn: [migrations]

  cmd:
    mayDependOn: [principal-domain, principal-port, principal-app, principal-adapter, policy-domain, policy-port, policy-app, policy-adapter, authn-domain, authn-port, authn-app, authn-adapter, key-port, key-app, key-adapter, quota-port, quota-app, quota-adapter, provision-port, provision-app, provision-adapter, provision-adapter-litellm, gatewayfeed-app, gatewayfeed-adapter, migrations]
