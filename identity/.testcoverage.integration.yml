# Integration-layer thresholds (AD-25), checked by go-test-coverage
# against the integration-tagged profile that make test-integration
# produces (coverage-integration.out). The unit profile excludes the
# driven adapters, the migration runner, and the integration helper;
# here the adapters and the migration runner are exercised for real, so
# only the cmd wiring file (AD-25 cmd rule) and the helper — whose code
# runs inside other packages' test binaries, so its coverage never
# records — are excluded.
profile: coverage-integration.out
threshold:
  file: 80
  package: 80
  total: 80
exclude:
  paths:
    - cmd/identityd/main.go
    - tests
    # The OIDC adapter's verification is pure unit-tested against a
    # stub verifier (JWKS discovery needs an IdP, not a database); the
    # integration layer covers the local provider half of the package.
    - internal/authn/adapter/oidc.go
