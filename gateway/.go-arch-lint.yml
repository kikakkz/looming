# AD-23 dependency matrix, extended for the gateway by AD-33 (same-PR
# rule). Version 3 schema (go-arch-lint v1.19): dependencies not
# declared under deps: are rejected. internal/ visibility plus this
# matrix are the two gates on package coupling.
#
# Slice B adds control-adapter: the identity HTTP client (feed fetch +
# watch long-poll + validate) and the identity-backed Authenticator
# implementing the front-port. It depends on control-app for the
# KeyCache/Syncer shapes and on front-port for the Authenticator
# contract; the JSON DTOs are defined adapter-side (AD-34 rule 2 — no
# shared platform lib, each component owns its wire shapes).
version: 3

allow:
  depOnAnyVendor: true # pinned deps live in go.mod; matrix governs
                       # component coupling, the job it exists for
  deepScan: false    # DI-pattern noise: adapters implementing ports
                     # consumed by app are the hexagon, not a violation

excludeFiles:
  - "^.*_test\\.go$" # test doubles legitimately cross seams

components:
  engineplane:     { in: internal/engineplane }
  front-domain:    { in: internal/front/domain }
  front-port:      { in: internal/front/port }
  front-app:       { in: internal/front/app }
  front-adapter:   { in: internal/front/adapter }
  control-domain:  { in: internal/control/domain }
  control-app:     { in: internal/control/app }
  control-adapter: { in: internal/control/adapter }
  engine-default:  { in: internal/engine/default }
  cmd:             { in: cmd/gateway }

deps:
  front-app:
    mayDependOn: [engineplane, front-domain, front-port]

  front-port:
    mayDependOn: [front-domain]

  front-adapter:
    mayDependOn: [front-domain, front-port]

  control-app:
    mayDependOn: [control-domain]

  control-adapter:
    mayDependOn: [front-port, control-app]

  engine-default:
    mayDependOn: [engineplane]

  cmd:
    mayDependOn: [engineplane, front-domain, front-app, front-adapter, control-domain, control-app, control-adapter, engine-default]
