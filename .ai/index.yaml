# Machine-readable index of the .ai/ control plane (borrowed back from
# the wait-agent survey, #48). Agents bootstrap from this file instead
# of crawling the directory.
#
# `make check-index` validates that every referenced file exists and
# rejects unknown sections. wait-agent's own integrity check passed
# vacuously while its anchors were dead links (#48 records the lesson),
# so this gate is strict: anything it cannot parse is an error, never
# silently skipped.
#
# Co-change (check_cochange.py): any PR that changes a file this
# index anchors must also touch this file, even when the pointer text
# is unchanged. AD-adding PRs regenerate decisions/README.md — record
# the pointer re-validation here (a comment update suffices).
