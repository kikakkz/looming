# Machine-readable index of the .ai/ control plane (borrowed back from
# the wait-agent survey, #48). Agents bootstrap from this file instead
# of crawling the directory.
#
# `make check-index` validates that every referenced file exists and
# rejects unknown sections. wait-agent's own integrity check passed
# vacuously while its anchors were dead links (#48 records the lesson),
# so this gate is strict: anything it cannot parse is an error, never
# silently skipped.
#
# Co-change (check_cochange.py): any PR that changes a file this
# index anchors must also touch this file, even when the pointer text
# is unchanged. AD-adding PRs regenerate decisions/README.md — record
# the pointer re-validation here (a comment update suffices).
# AD-29 re-validated 2026-10-02: all read_order anchors resolve.
# AD-30 re-validated 2026-10-03: all read_order anchors resolve.
# AD-31 re-validated 2026-10-03: all read_order anchors resolve.
# AGENTS.md move re-validated 2026-10-03 (co-change: lint-pr-body documented).
#
# Schema (intentionally minimal; parsed by .ai/tools/check_index.py
# with stdlib only):
#   key: value        scalar
#   key:              list  — followed by "  - item" lines
#   key:              map   — followed by "  sub: value" lines

read_order:
  - AGENTS.md
  - .ai/AGENTS.md
  - .ai/memory/activeContext.md
  - .ai/memory/decisions/README.md

read_on_demand:
  progress: .ai/memory/progress.md
  decisions: .ai/memory/decisions/
  skills: .ai/skills/
  tools: .ai/tools/
  semgrep: .ai/semgrep/rules/

required_rules:
  issue-driven: AGENTS.md hard constraint 1
  ci-first: AGENTS.md hard constraint 2
  upstream-first: .ai/skills/upstream-first/SKILL.md
  session-bootstrap: .ai/skills/session-bootstrap/SKILL.md
  backlog: .ai/skills/backlog/SKILL.md
  small-step-iteration: .ai/skills/small-step-iteration/SKILL.md
  issue-lifecycle: .ai/skills/issue-lifecycle/SKILL.md
  domain-design: .ai/skills/domain-design/SKILL.md

authoritative_sources:
  tracker: https://github.com/kikakkz/looming/issues
  decisions: .ai/memory/decisions/README.md
  gate: Makefile

directories:
  skills: .ai/skills/
  tools: .ai/tools/
  memory: .ai/memory/
