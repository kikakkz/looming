# External skill dependencies for this repository.
#
# Entries are pinned to an immutable git revision and fetched at install
# time, e.g.:
#   npx skills add github.com/<org>/<repo> --skill <path> --revision <sha>
#
# This repository is public on GitHub, so external skills are referenced,
# never vendored. Vendoring is a platform feature of Loom for air-gapped
# or private managed repositories, not something this repo does.
#
# CI (.github/workflows/ci.yml) validates schema, sha format, source
# allowlist, and license allowlist on every change.

[[skill]]
name = "superpowers"
source = "github.com/obra/superpowers"
path = "plugins/superpowers/skills"
revision = "5bf4e78011075bcfc0dc295f0724994cd123ee71"
license = "MIT"

