rules:
  - id: gh-auth-status-output-must-be-suppressed
    # bash mode cannot express this rule: redirections are optional in bash
    # patterns, so a redirected call is indistinguishable from a bare one.
    # Match the raw line with a regex instead; a leading `#` keeps comment
    # lines from matching.
    languages: [generic]
    severity: ERROR
    message: >-
      `gh auth status` writes account details to stdout; redirect stdout to
      a file or /dev/null, or pipe it into the consumer. `2>&1`-only
      redirection still leaks stdout to the terminal (CWE-532).
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      source: "PR #17 review finding: 'suppressed gh auth status output'"
      confidence: HIGH
    pattern-regex: '^[ \t]*gh[ \t]+auth[ \t]+status\b(?![^\n]*(?:\||(?<![0-9])>))'
