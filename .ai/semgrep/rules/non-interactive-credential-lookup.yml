# SPDX-License-Identifier: Apache-2.0
rules:
  - id: non-interactive-credential-lookup
    # generic mode: the guard tokens (env prefixes, assignments,
    # command substitutions) live outside the bash command node, so a
    # structural pattern cannot see them; match the raw line instead.
    languages: [generic]
    severity: ERROR
    message: >-
      Git operations that can ask for credentials (credential fill and
      the network commands) must disable both prompt channels:
      GIT_TERMINAL_PROMPT=0 for the terminal, and an empty GIT_ASKPASS or
      core.askPass for askpass helpers — git consults askpass before
      GIT_TERMINAL_PROMPT, so prompt=0 alone can still hang unattended on
      an interactive helper (CWE-358). Presence, not emptiness, is what a
      static rule can check: a nonempty GIT_ASKPASS assignment would also
      exempt a line — that provenance is a documented residual per the
      review-finding triage convention.
    metadata:
      cwe:
        - "CWE-358: Improperly Implemented Security Check for Standardized Input"
      source: >-
        PR #17 review findings: 'Keep credential lookup non-interactive',
        'Disable askpass for the credential lookup'
      confidence: HIGH
    patterns:
      # from line start (skipping comment lines) through the git
      # subcommand, so env assignments and $(...) wrappers sit inside
      # the finding range where the exemption lookaheads can see them
      - pattern-regex: '^[ \t]*(?![ \t]*#)[^\n]*?\bgit[ \t]+(?:-c[ \t]+\S+[ \t]+)?(?:credential[ \t]+fill|clone|fetch|pull|push|ls-remote)\b'
      # exempt only when BOTH guards are present on the line, in either
      # order (consuming alternation: a pure-lookahead regex produces
      # zero-width matches that pattern-not-regex does not honor)
      - pattern-not-regex: '(?:.*GIT_TERMINAL_PROMPT=0.*(?:GIT_ASKPASS|core\.askPass)|.*(?:GIT_ASKPASS|core\.askPass).*GIT_TERMINAL_PROMPT=0)'
