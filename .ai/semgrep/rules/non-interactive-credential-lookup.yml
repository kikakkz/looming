# SPDX-License-Identifier: Apache-2.0
rules:
  - id: non-interactive-credential-lookup
    languages: [bash]
    severity: ERROR
    message: >-
      Git operations that can ask for credentials (the credential helper
      and network commands) must run with GIT_TERMINAL_PROMPT=0 (and
      GIT_ASKPASS emptied where applicable): in unattended runs a missing
      credential must fail cleanly instead of waiting on a terminal or
      askpass prompt (CWE-358).
    metadata:
      cwe:
        - "CWE-358: Improperly Implemented Security Check for Standardized Cryptographic Algorithm"
      source: >-
        PR #17 review findings: 'Keep credential lookup non-interactive',
        'Disable askpass for the credential lookup'
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: git ... credential fill ...
          - pattern: env ... git ... credential fill ...
          - pattern: git clone ...
          - pattern: git fetch ...
          - pattern: git pull ...
          - pattern: git push ...
          - pattern: git ls-remote ...
      # bash patterns cannot match inline VAR=value command prefixes
      # (semgrep drops them), so the exemption is regex-based: any mention
      # of GIT_TERMINAL_PROMPT=0 in the matched statement exempts it.
      - pattern-not-regex: "GIT_TERMINAL_PROMPT=0"
