# SPDX-License-Identifier: Apache-2.0
rules:
  - id: checksum-gated-archive-extraction
    languages: [bash]
    severity: ERROR
    message: >-
      A downloaded archive is extracted without a checksum verification
      between the download and the extraction. Verify the archive after
      downloading and before extracting, and make sure a mismatch aborts
      the run (see checksum-result-ignored) (CWE-353 / CWE-345).
    metadata:
      cwe:
        - "CWE-353: Missing Support for Integrity Check"
        - "CWE-345: Insufficient Verification of Data Authenticity"
      source: >-
        PR #17 review findings: 'Keep the previous installation until
        extraction succeeds', 'Add a checksum-failure installation test'
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          curl ... -o $ARCHIVE ...
          ...
      - pattern: tar $MODE ... $ARCHIVE ...
      # extraction modes only: short-flag clusters containing x (-xzf),
      # or the long extraction forms; create/list/append/update/delete
      # modes never extract
      - metavariable-regex:
          metavariable: $MODE
          regex: '^(--extract|--get|-[A-Za-z]*x[A-Za-z]*)$'
      # a verification step between the matched download and the
      # extraction lifts the gate. File-level dataflow is a documented
      # approximation: the rule checks that a `sha256sum -c` runs after
      # the download and before the extraction, not that it names the
      # same file (semgrep bash has no taint tracking). Whether the
      # checksum failure aborts is codified separately in
      # checksum-result-ignored.
      - pattern-not-inside: |
          curl ... -o $ARCHIVE ...
          ...
          sha256sum ... -c ...
          ...
          tar ... $ARCHIVE ...
