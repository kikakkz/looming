# Coverage thresholds (AD-25), checked by go-test-coverage.
profile: coverage.out
threshold:
  file: 80
  package: 80
  total: 80
exclude:
  paths:
    # cmd packages are manual-DI wiring only (AD-23); their behaviour
    # is covered through the capability tests.
    - cmd/looming
    # dbcmd's RunE bodies beyond input validation are exercised at the
    # integration layer (real schema via testcontainers,
    # .testcoverage.integration.yml) — the same split the retired
    # topology ctl's command file carried (#108's migration): the unit
    # layer covers validation and wiring only.
    - internal/admin/dbcmd
