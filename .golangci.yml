# AD-24 budgets (ratchet down only via a superseding AD) plus the
# hidden-defect sentinels agreed in #99: errcheck (no swallowed
# errors), govet+shadow (no shadowed variables), staticcheck.
run:
  timeout: 5m
linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - funlen
    - gocognit
    - gocyclo
linters-settings:
  govet:
    enable:
      - shadow
  funlen:
    statements: 50
    ignore-comments: true
  gocognit:
    min-complexity: 30
  gocyclo:
    min-complexity: 15
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
