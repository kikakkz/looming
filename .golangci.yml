# Golangci-lint configuration (AD-24). Complexity budgets are the ratchet
# contract: funlen 50 statements, gocognit 30, cyclomatic 15. Tightening
# happens only by superseding AD-24. The CI job runs
# `golangci-lint run` — it lands with the first Go component (CI-first
# rule); until then this file is prospective and unenforced.
version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - depguard
    - funlen
    - gocognit
    - gosec
    - misspell
    - nolintlint
  settings:
    funlen:
      lines: -1 # statements are the honest proxy; long decl tables are fine
      statements: 50
    gocognit:
      min-complexity: 30
    cyclop:
      max-complexity: 15
      package-average: 0
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        domain-purity:
          files:
            - "**/domain/**/*.go"
          deny:
            # Any import path whose first segment contains a dot is
            # non-stdlib (github.com/..., golang.org/x/...); stdlib
            # paths (net/http, crypto/tls) never match.
            - pkg: '^[a-z0-9_-]*(\.[a-z0-9_-]+)+/'
              desc: "domain packages import stdlib only (AD-23)"

formatters:
  enable:
    - gofmt
    - goimports
