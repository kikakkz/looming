# Golangci-lint configuration (AD-24). Complexity budgets are the ratchet
# contract: funlen 50 statements, gocognit 30, cyclomatic 15. Tightening
# happens only by superseding AD-24. Enforced since the first Go
# component (#99); CI runs golangci-lint v2 against this v2 schema.
version: "2"

linters:
  default: standard # errcheck, govet, staticcheck, and the standard set
  enable:
    - cyclop
    - depguard
    - funlen
    - gocognit
    - gosec
    - misspell
    - nolintlint
  settings:
    funlen:
      lines: -1 # statements are the honest proxy; long decl tables are fine
      statements: 50
    gocognit:
      min-complexity: 30
    cyclop:
      max-complexity: 15
      package-average: 0
    govet:
      enable:
        - shadow # hidden-defect sentinel (#99): no shadowed variables
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        domain-purity:
          list-mode: strict
          files:
            - "**/domain/**/*.go"
          allow:
            - $gostd # stdlib only (AD-23); anything else is rejected

formatters:
  enable:
    - gofmt
    - goimports
