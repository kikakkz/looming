name: Feature
description: A capability the platform should gain.
title: "feat: "
labels: ["kind/feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which module this belongs to (see CONTRIBUTING.md).
      options:
        - gateway
        - runtime
        - sandbox
        - registry
        - memory
        - scm-adapters
        - pipeline
        - bundle
        - ci
        - docs
        - ai-assets
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What organizational or user need drives this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable statements defining "done".
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: decision
    attributes:
      label: Related decision
      placeholder: "e.g. AD-12 (see .ai/memory/decisions.md)"
