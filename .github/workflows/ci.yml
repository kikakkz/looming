name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # trailer checks walk commit ranges

      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install Go tooling
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          go install github.com/vladopajic/go-test-coverage/v2@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        with:
          python-version: "3.12"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install semgrep
        run: pipx install semgrep || python3 -m pip install semgrep

      - name: ci-gate
        run: make ci-gate

      - name: Co-change tripwire (PRs only)
        if: github.event_name == 'pull_request'
        run: python3 .ai/tools/check_cochange.py --base "${{ github.event.pull_request.base.sha }}"

      - name: DCO + trailer check on PR commits
        # Check the branch commits (base..head), NOT the checked-out merge
        # commit — GitHub's ephemeral test merge never carries trailers.
        if: github.event_name == 'pull_request'
        run: bash .ai/tools/check-trailers.sh --dco "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: PR body issue-reference lint (Refs needs a reason)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .ai/tools/check_pr_body.py
