# AD-23 dependency matrix for the topology component (AD-34 component
# scope). Version 3 schema (go-arch-lint v1.19): dependencies not
# declared under deps: are rejected. internal/ visibility plus this
# matrix are the two gates on package coupling.
#
# CLI-1 (#108) extracted the component's headless core — the
# topology/host/guide/join capabilities (domain/port/app/adapter), the
# apply chain (config/render/exec/apply), the schema migrations, and
# the integration test helper — into the platform/go shared kit
# (AD-34 rule 2's two-consumer trigger: cli's admin face and this
# component's topologyd both consume it). What remains here is the
# topologyd binary alone: wiring only (main + mux assembly), importing
# the platform/go services and adapters. There is no internal/ tree
# left to govern; every platform/go import is an external (vendor)
# dependency, allowed by depOnAnyVendor and pinned in go.mod.
version: 3

allow:
  depOnAnyVendor: true # pinned deps live in go.mod; matrix governs
                       # component coupling, the job it exists for
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$" # test doubles legitimately cross seams

components:
  cmd: { in: cmd/topologyd }

# cmd imports only the platform/go kit (vendor, allowed by
# depOnAnyVendor and pinned in go.mod); cmd is the component's only
# component, so its project-dependency set is empty and there is
# nothing to name in mayDependOn — but the schema requires a deps entry
# to be non-empty. anyProjectDeps is the escape hatch: "any of the
# zero other project components". The moment an internal/ package
# returns to this component, replace this with an explicit mayDependOn.
deps:
  cmd:
    anyProjectDeps: true
