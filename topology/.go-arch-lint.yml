# AD-23 dependency matrix for the topology component (AD-34 component
# scope; matrix extended for this component per AD-33's same-PR rule).
# Version 3 schema (go-arch-lint v1.19): dependencies not declared under
# deps: are rejected. internal/ visibility plus this matrix are the two
# gates on package coupling.
#
# T0 (#107) wires two capabilities: topology (desired-state Topology
# aggregate + ComponentPlacement value object, topology-l1 §5) and host
# (registered machine aggregate). The two capabilities stay independent:
# topology-app validates placements against the *declared* host IDs given
# as declare input — host existence in the registry is T1 apply's
# orchestration concern (register hosts, then declare).
#
# T1 (#107) adds the converge pipeline around them: config (the
# versioned topology.yaml loader), render (topology → per-host compose,
# topology-l1 §6 Renderer port, phase-1 docker backend), exec (the
# executor channel: docker CLI, local + DOCKER_HOST=ssh backends), and
# apply (the pipeline orchestrating load → state plane → declare →
# render → per-host converge; owns the composition root's StdDeps
# wiring and the deterministic YAML-id → uuid database-id mapping).
# apply is the only package that may fan out to both capabilities'
# adapters. The admin CLI lands as cmd/looming-ctl for T1 — a noted
# temporary placement pending #108's CLI layout decision.
#
# T2 (#107) adds the join capability (topology-l1 §5 JoinToken row +
# §7 join/rejoin surface): join-domain (token aggregate, TTL/consume
# rules, host-id minting), join-port (TokenStore seam), join-app
# (mint/consume/re-join use cases + the HTTP handler), and
# join-adapter (the postgres store — the slice-A guarded-UPDATE
# precedent — plus the ctl-side HTTP client). join-app orchestrates
# across the host capability (registration, credential slot) and the
# topology capability (the gateway-front access hint), so the matrix
# admits those reads. Two binaries consume it: cmd/topologyd serves
# the API; cmd/looming-ctl adds the admin-side token commands and the
# pulling host's join command.
version: 3

allow:
  depOnAnyVendor: true # pinned deps live in go.mod; matrix governs
                       # component coupling, the job it exists for
  deepScan: false    # DI-pattern noise: adapters implementing ports
                     # consumed by app are the hexagon, not a violation

excludeFiles:
  - "^.*_test\\.go$" # test doubles legitimately cross seams

components:
  topology-domain:    { in: internal/topology/domain }
  topology-port:      { in: internal/topology/port }
  topology-app:       { in: internal/topology/app }
  topology-adapter:   { in: internal/topology/adapter }
  host-domain:        { in: internal/host/domain }
  host-port:          { in: internal/host/port }
  host-app:           { in: internal/host/app }
  host-adapter:       { in: internal/host/adapter }
  join-domain:        { in: internal/join/domain }
  join-port:          { in: internal/join/port }
  join-app:           { in: internal/join/app }
  join-adapter:       { in: internal/join/adapter }
  config:             { in: internal/config }
  render:             { in: internal/render }
  exec:               { in: internal/exec }
  apply:              { in: internal/apply }
  cmd:                { in: cmd/looming-ctl }
  cmd-topologyd:      { in: cmd/topologyd }
  migrations:         { in: migrations }
  tests:              { in: tests/pgtest }

deps:
  topology-port:
    mayDependOn: [topology-domain]

  topology-app:
    mayDependOn: [topology-domain, topology-port]

  topology-adapter:
    mayDependOn: [topology-domain, topology-port]

  host-port:
    mayDependOn: [host-domain]

  host-app:
    mayDependOn: [host-domain, host-port]

  host-adapter:
    mayDependOn: [host-domain, host-port]

  join-port:
    mayDependOn: [join-domain]

  join-app:
    mayDependOn: [join-domain, join-port, host-domain, host-port, topology-domain, topology-port]

  join-adapter:
    mayDependOn: [join-domain, join-port]

  config:
    mayDependOn: [render, topology-domain]

  render:
    mayDependOn: [topology-domain]

  apply:
    mayDependOn: [config, render, exec, topology-domain, topology-port, topology-app, topology-adapter, host-domain, host-port, host-adapter, migrations]

  cmd:
    mayDependOn: [apply, exec, join-domain, join-app, join-adapter, host-adapter, topology-adapter, migrations]

  cmd-topologyd:
    mayDependOn: [join-app, join-adapter, host-adapter, topology-adapter, migrations]

  tests:
    mayDependOn: [migrations]
