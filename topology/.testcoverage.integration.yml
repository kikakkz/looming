# Integration-layer thresholds (AD-25), checked by go-test-coverage
# against the integration-tagged profile. The component is the
# topologyd wiring binary alone after CLI-1 (#108) extracted the
# headless core into platform/go; the cmd wiring file is excluded per
# the AD-25 cmd rule (main()/run() are covered by execution, never by
# assertions; the boot smoke test exercises the real binary).
profile: coverage-integration.out
threshold:
  file: 80
  package: 80
  total: 80
exclude:
  paths:
    - cmd/topologyd
