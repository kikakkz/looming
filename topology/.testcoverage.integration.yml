# Integration-layer thresholds (AD-25), checked by go-test-coverage
# against the integration-tagged profile that make test-integration
# produces (coverage-integration.out). The unit profile excludes the
# driven adapters, the migration runner, the ctl wiring, and the
# integration helper; here the adapters, the migration runner, and
# apply's composition-root wiring are exercised for real, so only the
# cmd wiring files (AD-25 cmd rule — main() is covered only by
# execution, never by tests: looming-ctl's run() at the unit layer,
# topologyd's run() at this layer; the boot smoke tests exist but the
# wiring files do not count toward the thresholds) and the helper —
# whose code runs inside other packages' test binaries, so its coverage
# never records — are excluded.
profile: coverage-integration.out
threshold:
  file: 80
  package: 80
  total: 80
exclude:
  paths:
    - cmd/looming-ctl/main.go
    - cmd/topologyd/main.go
    - tests
