# Coverage thresholds (AD-25), checked by go-test-coverage against the
# unit-layer profile. The component is the topologyd wiring binary
# alone after CLI-1 (#108) extracted the headless core into
# platform/go: cmd files are manual-DI wiring (AD-25 cmd rule), covered
# by execution and the integration smoke, not unit assertions.
profile: coverage.out
threshold:
  file: 80
  package: 80
  total: 80
exclude:
  paths:
    - cmd/topologyd
