# SPDX-License-Identifier: Apache-2.0

# Released combination pins (release skill): the bundle tag snapshots
# this manifest, and apply resolves every placed component's image pin
# from it at render time (release-l1 §3.4/§3.5, #160). A component
# release is followed by a PR bumping only that component's pin.
components:
  gateway: v0.1.0
  identity: v0.1.0
  topology: v0.1.0
# Upstream control-plane images (AD-41, #112): version-pinned but never
# vendored — looming manages and renders these; the upstream registry
# owns the bits (release-l1 §3.4). Same pin-bump PR discipline. The
# literal :latest tag is refused by both the loader and release CI;
# other moving tags (nightly, edge) pass syntax checks, so pin only
# tags the upstream itself treats as immutable — that verification is
# the pin-bumper's duty, not the gate's.
# derper is deliberately absent until slice C1 decides its image shape:
# Tailscale publishes no official derper image (community builds only),
# so it either joins `components:` as a source-built image or lands
# here as a vetted upstream ref.
upstream:
  headscale: headscale/headscale:0.29.6
